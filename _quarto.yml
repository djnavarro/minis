project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - "*/vignette.qmd"

execute:
  freeze: auto

website:
  title: "minis"
  description: >
    Small, standalone, zero-runtime-dependency R components, each
    shipped as a single copy-and-paste .R file.
  navbar:
    right:
      - icon: github
        href: https://github.com/djnavarro/minis
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - section: "Minis"
        contents:
          - href: minicli/vignette.qmd
            text: minicli
          - href: minimap/vignette.qmd
            text: minimap
          - href: minitrap/vignette.qmd
            text: minitrap
          - href: minifilter/vignette.qmd
            text: minifilter
          - href: minicase/vignette.qmd
            text: minicase
          - href: minijoin/vignette.qmd
            text: minijoin
          - href: minitable/vignette.qmd
            text: minitable
          - href: minicondition/vignette.qmd
            text: minicondition
          - href: minipivot/vignette.qmd
            text: minipivot

format:
  html:
    highlight-style: atom-one
    respect-user-color-scheme: true
    theme:
      light: paleblue.scss
      dark: blackpink.scss
    toc: true
    output-file: index
