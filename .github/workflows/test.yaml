on:
  push:
  pull_request:

name: test-minis

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install dev dependencies
        run: install.packages(c("testthat", "withr"))
        shell: Rscript {0}
      - name: Run mini test suites
        run: Rscript run_tests.R
